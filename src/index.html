<!doctype html>
<html
  lang="en"
  class="page"
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Landing Page</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Roboto:wdth,wght@75..100,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./styles/main.scss"
    />
    <script
      src="scripts/main.js"
      defer
    ></script>
  </head>

  <body class="page__body">
    <header class="header">
      <div class="top-bar">
        <a
          href="#"
          class="top-bar__logo"
        >
          <img
            src="images/BOSE_logo.png"
            alt="BOSE logo"
          />
        </a>
        <div class="top-bar__icons">
          <a
            href="#"
            class="icon icon--phone"
          >
            <img
              src="icons/icon_phone.png"
              alt="Phone Icon"
            />
          </a>
          <a
            href="#menu"
            class="icon icon--menu"
          >
            <img
              src="icons/icon_burger_menu.png"
              alt="Menu Icon"
            />
          </a>
        </div>
      </div>

      <aside
        class="page__menu menu"
        id="menu"
      >
        <div class="menu__content">
          <div class="top-bar menu__top">
            <a
              href="#"
              class="top-bar__logo"
            >
              <img
                src="images/BOSE_logo.png"
                alt="BOSE logo"
              />
            </a>

            <a
              href="#"
              class="icon icon--close"
            >
              <img
                src="icons/icon-close.png"
                alt="Phone Icon"
              />
            </a>
          </div>
          <div class="menu__content__bar">
            <nav class="nav menu__nav">
              <ul class="nav__list">
                <li class="nav__item">
                  <a
                    class="nav__link"
                    href="#recommended"
                  >
                    Recommended
                  </a>
                </li>
                <li class="nav__item">
                  <a
                    class="nav__link"
                    href="#categories"
                  >
                    Categories
                  </a>
                </li>
                <li class="nav__item">
                  <a
                    class="nav__link"
                    href="#about-us"
                  >
                    About Us
                  </a>
                </li>
                <li class="nav__item">
                  <a
                    class="nav__link"
                    href="#contact-us"
                  >
                    Contact Us
                  </a>
                </li>
              </ul>
            </nav>

            <a
              href="tel:+1 234 5555-55-55"
              class="menu__phone-number"
            >
              +1 234 5555-55-55
            </a>
            <a
              href="tel:+1 234 5555-55-55"
              class="menu__call-to-order"
            >
              call to order
            </a>
          </div>
        </div>
      </aside>

      <div class="header__bottom">
        <h1 class="header__title">
          Your senses.
          <br />
          Set free.
        </h1>
      </div>
    </header>

    <main class="main">
      <section
        class="recommended"
        id="recommended"
      >
        <h2>Recommended</h2>
      </section>

      <section
        class="categories"
        id="categories"
      >
        <h2>
          Sound. Vision.
          <br />
          It’s your pick.
        </h2>
      </section>

      <section
        class="about-us"
        id="about-us"
      >
        <h2>Timeless, for 50 years and counting</h2>
      </section>

      <section
        class="contact-us"
        id="contact-us"
      >
        <h2>Contact us</h2>
      </section>
    </main>

    <footer class="footer"></footer>
  </body>
</html>
